<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CubaRemesa — Envía dinero a Cuba, con alma</title>
<meta name="description" content="Envía dinero a Cuba en minutos. Paga con PayPal o transferencia bancaria. Tu familia recibe MLC, USD en efectivo, pesos cubanos o recarga Cubacel.">
<meta name="view-transition" content="same-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="header"></div>

<!-- ======================= HERO (pinned money-flow scrollytelling) ======================= -->
<section class="hero-scrolly">
  <div class="hero-stage">
    <div class="hero-head"><h1></h1></div>

    <svg class="hero-scene" viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="#e07a35" stop-opacity="0.20"/>
          <stop offset="100%" stop-color="#e07a35" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#f3b14e"/>
          <stop offset="60%" stop-color="#ffcf7a"/>
          <stop offset="100%" stop-color="#2bb3a3"/>
        </linearGradient>
        <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff1cf" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#ffcf7a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="famGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f3b14e" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#f3b14e" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <ellipse cx="600" cy="270" rx="580" ry="250" fill="url(#bgGlow)"/>

      <!-- family glow behind receiving phone -->
      <circle id="familyGlow" cx="1000" cy="360" r="120" fill="url(#famGlow)"/>

      <!-- Cuba island lights up on arrival -->
      <path id="cubaGlow" d="M905,150 q40,-20 92,-8 q40,10 20,30 q-40,22 -92,10 q-38,-12 -20,-32 z" fill="#f3b14e"/>

      <!-- faint guide route (always visible) + the bright arc that draws on scroll -->
      <path d="M214,372 C420,150 800,132 992,196" fill="none" stroke="#f3b14e" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="4 12" stroke-linecap="round"/>
      <path id="flowArc" d="M214,372 C420,150 800,132 992,196" fill="none" stroke="url(#arcGrad)" stroke-width="4" stroke-linecap="round"/>

      <!-- sender phone -->
      <g class="phone">
        <rect x="120" y="300" width="88" height="176" rx="16" fill="#2b1b12" stroke="#6a4a30" stroke-width="2"/>
        <rect x="128" y="312" width="72" height="152" rx="8" fill="#3a2517"/>
        <circle cx="164" cy="388" r="16" fill="#f3b14e"/>
        <text x="164" y="394" text-anchor="middle" font-family="Inter, Arial" font-size="17" font-weight="800" fill="#2a160a">$</text>
      </g>

      <!-- receiving phone -->
      <g class="phone">
        <rect x="956" y="300" width="88" height="176" rx="16" fill="#2b1b12" stroke="#6a4a30" stroke-width="2"/>
        <rect x="964" y="312" width="72" height="152" rx="8" fill="#3a2517"/>
        <path d="M986 388 l10 10 l20 -22" fill="none" stroke="#2bb3a3" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- travelling value -->
      <g id="flowDot">
        <circle r="22" fill="url(#dotGlow)"/>
        <circle r="8" fill="#fff1cf"/>
      </g>
    </svg>

    <div class="phases">
      <div class="phase"><div class="k" data-i18n="flow.k1"></div><div class="d" data-i18n="flow.d1"></div></div>
      <div class="phase"><div class="k" data-i18n="flow.k2"></div><div class="d" data-i18n="flow.d2"></div></div>
      <div class="phase"><div class="k" data-i18n="flow.k3"></div><div class="d" data-i18n="flow.d3"></div></div>
    </div>

    <div class="hero-cta">
      <a class="btn btn-primary" href="/send.html" data-i18n="cta.btn"></a>
      <a class="btn btn-ghost" href="#calc" data-i18n="calc.title"></a>
    </div>
  </div>
</section>

<!-- marquee ticker -->
<div class="marquee"><div class="marquee-track" id="marqueeTrack"></div></div>

<!-- ======================= CALCULATOR ======================= -->
<section class="block" id="calc" style="padding-top:96px">
  <div class="container" style="max-width:560px">
    <div class="section-head reveal" style="margin-bottom:32px">
      <div class="eyebrow" data-i18n="calc.title"></div>
      <h2 data-i18n="methods.title"></h2>
    </div>
    <div class="calc reveal">
      <div class="field">
        <label data-i18n="calc.send"></label>
        <div class="amount-row"><input id="amount" type="number" inputmode="decimal" value="100" min="1" step="1"><span class="cur">USD</span></div>
      </div>
      <div class="field">
        <label data-i18n="calc.receiveVia"></label>
        <select id="method"></select>
      </div>
      <div class="breakdown" id="breakdown"></div>
      <div class="err hidden" id="calcErr"></div>
      <a class="btn btn-primary btn-block" id="calcGo" href="/send.html" data-i18n="common.continue"></a>
      <p class="muted center" style="font-size:.78rem;margin:.8rem 0 0" data-i18n="calc.indicative"></p>
    </div>
  </div>
</section>

<!-- ======================= METHODS ======================= -->
<section class="block" id="methods" style="padding-top:0">
  <div class="container">
    <div class="section-head reveal">
      <div class="eyebrow" data-i18n="methods.eyebrow"></div>
      <h2 data-i18n="methods.title"></h2>
      <p data-i18n="methods.sub"></p>
    </div>
    <div class="cards" id="methodCards"></div>
  </div>
</section>

<!-- ======================= STORY ======================= -->
<section class="block" style="padding-top:0">
  <div class="container">
    <div class="story">
      <div class="reveal">
        <div class="eyebrow" data-i18n="trust.eyebrow"></div>
        <h2 data-i18n="story.title"></h2>
        <p data-i18n="story.body"></p>
        <div style="margin-top:22px"><a class="btn btn-ghost" href="/send.html" data-i18n="how.cta"></a></div>
      </div>
      <div class="media reveal" style="--story-img:url('/img/family.jpg')"></div>
    </div>
  </div>
</section>

<!-- ======================= HOW IT WORKS ======================= -->
<section class="block" id="how" style="padding-top:0">
  <div class="container">
    <div class="section-head reveal">
      <div class="eyebrow" data-i18n="how.eyebrow"></div>
      <h2 data-i18n="how.title"></h2>
    </div>
    <div class="steps">
      <div class="step reveal"><div class="num">1</div><h3 data-i18n="how.s1t"></h3><p data-i18n="how.s1p"></p></div>
      <div class="step reveal"><div class="num">2</div><h3 data-i18n="how.s2t"></h3><p data-i18n="how.s2p"></p></div>
      <div class="step reveal"><div class="num">3</div><h3 data-i18n="how.s3t"></h3><p data-i18n="how.s3p"></p></div>
      <div class="step reveal"><div class="num">4</div><h3 data-i18n="how.s4t"></h3><p data-i18n="how.s4p"></p></div>
    </div>
  </div>
</section>

<!-- ======================= TRUST BAND ======================= -->
<section class="band">
  <div class="band-bg" style="--band-img:url('/img/malecon.jpg')" data-parallax="0.06"></div>
  <div class="container">
    <div class="section-head reveal">
      <div class="eyebrow" data-i18n="trust.eyebrow"></div>
      <h2 data-i18n="trust.title"></h2>
      <p data-i18n="trust.sub"></p>
    </div>
    <div class="stats" style="margin-bottom:48px">
      <div class="stat reveal"><div class="n"><span data-count="5">5</span></div><div class="l" data-i18n="stats.ways"></div></div>
      <div class="stat reveal"><div class="n" data-i18n="stats.minsValue"></div><div class="l" data-i18n="stats.mins"></div></div>
      <div class="stat reveal"><div class="n"><span data-count="16">16</span></div><div class="l" data-i18n="stats.provinces"></div></div>
      <div class="stat reveal"><div class="n">24/7</div><div class="l" data-i18n="stats.support"></div></div>
    </div>
    <div class="features">
      <div class="feature reveal"><div class="ico">🔒</div><h3 data-i18n="trust.f1t"></h3><p data-i18n="trust.f1p"></p></div>
      <div class="feature reveal"><div class="ico">🧾</div><h3 data-i18n="trust.f2t"></h3><p data-i18n="trust.f2p"></p></div>
      <div class="feature reveal"><div class="ico">🇨🇺</div><h3 data-i18n="trust.f3t"></h3><p data-i18n="trust.f3p"></p></div>
    </div>
  </div>
</section>

<!-- ======================= FEES ======================= -->
<section class="block" id="fees">
  <div class="container">
    <div class="section-head reveal">
      <div class="eyebrow" data-i18n="fees.eyebrow"></div>
      <h2 data-i18n="fees.title"></h2>
      <p data-i18n="fees.sub"></p>
    </div>
    <div class="card-box reveal" style="overflow-x:auto">
      <table class="tbl" id="feesTable">
        <thead><tr>
          <th data-i18n="fees.method"></th><th data-i18n="fees.receiveIn"></th>
          <th data-i18n="fees.rate"></th><th data-i18n="fees.fee"></th><th data-i18n="fees.deliveryCol"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</section>

<!-- ======================= FAQ ======================= -->
<section class="block" id="faq" style="padding-top:0">
  <div class="container" style="max-width:800px">
    <div class="section-head reveal"><div class="eyebrow" data-i18n="faq.eyebrow"></div><h2 data-i18n="faq.title"></h2></div>
    <div id="faqList"></div>
  </div>
</section>

<!-- ======================= CTA ======================= -->
<section class="block" style="padding-top:0">
  <div class="container">
    <div class="cta reveal" style="--cta-img:url('/img/cta.jpg')">
      <h2 data-i18n="cta.title"></h2>
      <p data-i18n="cta.sub"></p>
      <a class="btn btn-red" href="/send.html" data-i18n="cta.btn"></a>
    </div>
  </div>
</section>

<div id="footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>

<script type="module">
import { api, METHOD_ICONS, money, t, getLang, renderHeader, renderFooter, applyI18n, initMotion } from '/js/app.js';
import { methodLabel, methodEta } from '/js/i18n.js';
import { initMotionPro, initReveals } from '/js/motion.js';

let RATES = [];

async function boot() {
  await renderHeader();
  renderFooter();
  applyI18n();
  const { rates } = await api.get('/api/rates');
  RATES = rates;
  document.getElementById('method').innerHTML = rates.map(r => `<option value="${r.payout_method}"></option>`).join('');
  document.getElementById('amount').addEventListener('input', updateQuote);
  document.getElementById('method').addEventListener('change', updateQuote);
  document.addEventListener('langchange', () => {
    renderHeadline(); renderMarquee(); renderDynamic();
    if (window.gsap && window.ScrollTrigger) initReveals(); else initMotion();
  });
  renderHeadline();
  renderMarquee();
  renderDynamic();
  updateQuote();

  // Motion: GSAP/Lenis when available, else IntersectionObserver fallback.
  if (window.gsap && window.ScrollTrigger) initMotionPro();
  else initMotion();
  window.__headlineReady = true;
}

function renderHeadline() {
  const h = document.querySelector('.hero-head h1');
  h.innerHTML = `${t('hero.title1')} <em>${t('hero.title2cine')}</em>`;
  // If GSAP already ran once, re-split for the new language.
  if (window.__headlineReady && window.gsap) {
    import('/js/motion.js').then(m => m.initHeadline());
  }
}

function renderMarquee() {
  const items = [
    ...RATES.map(r => methodLabel(r.payout_method)),
    'PayPal', 'IBAN / SEPA', t('marquee.delivery'), t('marquee.secure'), t('marquee.fast'),
  ];
  const html = items.map(x => `<span class="marquee-item"><span class="dot"></span>${x}</span>`).join('');
  document.getElementById('marqueeTrack').innerHTML = html + html; // duplicate for seamless loop
}

function renderDynamic() {
  applyI18n();
  const sel = document.getElementById('method');
  [...sel.options].forEach(o => { o.textContent = methodLabel(o.value); });

  document.getElementById('methodCards').innerHTML = RATES.map(r => `
    <div class="pcard reveal">
      <div class="ico">${METHOD_ICONS[r.payout_method] || '💸'}</div>
      <h3>${methodLabel(r.payout_method)}</h3>
      <p>${t('methods.receiveIn')} <b style="color:var(--cream)">${r.payout_currency}</b>. ${t('methods.min')} $${r.min_send} · ${t('methods.max')} $${r.max_send}.</p>
      <div class="eta">⏱ ${methodEta(r.payout_method)}</div>
    </div>`).join('');

  document.querySelector('#feesTable tbody').innerHTML = RATES.map(r => `
    <tr>
      <td>${METHOD_ICONS[r.payout_method] || ''} ${methodLabel(r.payout_method)}</td>
      <td>${r.payout_currency}</td>
      <td>${r.rate} ${r.payout_currency}</td>
      <td>${feeText(r)}</td>
      <td>${methodEta(r.payout_method)}</td>
    </tr>`).join('');

  const faq = [['faq.q1','faq.a1'],['faq.q2','faq.a2'],['faq.q3','faq.a3'],['faq.q4','faq.a4'],['faq.q5','faq.a5']];
  document.getElementById('faqList').innerHTML = faq.map(([q,a]) => `
    <details class="card-box reveal" style="margin-bottom:14px">
      <summary>${t(q)}</summary>
      <p style="margin:.8rem 0 0">${t(a)}</p>
    </details>`).join('');

  updateQuote();
}

function feeText(r) {
  if (!r.fee_pct && !r.fee_fixed) return t('fees.free');
  return `${r.fee_pct ? r.fee_pct + '%' : ''}${r.fee_pct && r.fee_fixed ? ' + ' : ''}${r.fee_fixed ? '$' + r.fee_fixed : ''}`;
}

let quoteTimer;
function updateQuote() { clearTimeout(quoteTimer); quoteTimer = setTimeout(doQuote, 220); }
async function doQuote() {
  const amount = document.getElementById('amount').value;
  const method = document.getElementById('method').value;
  const errEl = document.getElementById('calcErr');
  const bd = document.getElementById('breakdown');
  const go = document.getElementById('calcGo');
  if (!amount || Number(amount) <= 0) { bd.innerHTML = `<div class="row">${t('calc.enterAmount')}</div>`; return; }
  try {
    const q = await api.get(`/api/quote?amount=${encodeURIComponent(amount)}&payout_method=${method}`);
    bd.innerHTML = `
      <div class="row"><span>${t('calc.transferAmount')}</span><span>${money(q.send_amount)}</span></div>
      <div class="row"><span>${t('calc.fee')}</span><span>${money(q.fee)}</span></div>
      <div class="row total"><span>${t('calc.youPay')}</span><span>${money(q.total_charge)}</span></div>
      <div class="row get"><span>${t('calc.theyReceive')}</span><span>${money(q.payout_amount, q.payout_currency)}</span></div>
      <div class="row" style="margin-top:6px"><span>${t('calc.delivery')}</span><span>${methodEta(q.payout_method)}</span></div>`;
    if (q.errors && q.errors.length) { errEl.textContent = q.errors.join(' '); errEl.classList.remove('hidden'); go.classList.add('hidden'); }
    else { errEl.classList.add('hidden'); go.classList.remove('hidden'); go.href = `/send.html?amount=${q.send_amount}&method=${q.payout_method}`; }
  } catch (e) { bd.innerHTML = `<div class="row">${e.message}</div>`; }
}

boot();
</script>
</body>
</html>
