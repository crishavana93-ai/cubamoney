<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CubaRemesa — Envía dinero a Cuba, con alma</title>
<meta name="description" content="Envía dinero a Cuba en minutos. Paga con PayPal o transferencia bancaria. Tu familia recibe MLC, USD en efectivo, pesos cubanos o recarga Cubacel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="header"></div>

<!-- ======================= HERO ======================= -->
<section class="hero">
  <div class="hero-media">
    <!-- Hand-built cinematic Havana sunset (fallback). A photo at /img/hero.jpg overlays it when present. -->
    <svg class="hero-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#160d0a"/>
          <stop offset="38%" stop-color="#5b2812"/>
          <stop offset="60%" stop-color="#b8481c"/>
          <stop offset="76%" stop-color="#f0a847"/>
          <stop offset="100%" stop-color="#ffd488"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f0b35a"/>
          <stop offset="22%" stop-color="#9a5a2e"/>
          <stop offset="60%" stop-color="#2a4a4a"/>
          <stop offset="100%" stop-color="#13201f"/>
        </linearGradient>
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff1cf" stop-opacity="1"/>
          <stop offset="35%" stop-color="#ffd27a" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffe6b0" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#ffe6b0" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <!-- sky + sun -->
      <rect x="0" y="0" width="1600" height="540" fill="url(#sky)"/>
      <circle cx="1120" cy="300" r="240" fill="url(#sunGlow)">
        <animate attributeName="r" values="240;265;240" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="320" r="92" fill="#ffe9b8"/>

      <!-- distant city silhouette on the horizon -->
      <g fill="#1d100a" opacity="0.92">
        <rect x="0" y="468" width="180" height="72"/>
        <rect x="180" y="486" width="120" height="54"/>
        <rect x="300" y="452" width="90" height="88"/>
        <rect x="380" y="476" width="150" height="64"/>
        <rect x="520" y="462" width="70" height="78"/>
        <rect x="590" y="488" width="130" height="52"/>
        <rect x="980" y="470" width="120" height="70"/>
        <rect x="1100" y="452" width="80" height="88"/>
        <rect x="1180" y="482" width="160" height="58"/>
        <rect x="1340" y="466" width="110" height="74"/>
        <rect x="1450" y="486" width="150" height="54"/>
      </g>
      <!-- a few lit windows -->
      <g fill="#ffcf7a" opacity="0.8">
        <rect x="330" y="470" width="6" height="9"/><rect x="350" y="486" width="6" height="9"/>
        <rect x="1120" y="470" width="6" height="9"/><rect x="1140" y="490" width="6" height="9"/>
        <rect x="40" y="486" width="6" height="9"/><rect x="1380" y="486" width="6" height="9"/>
      </g>

      <!-- sea -->
      <rect x="0" y="540" width="1600" height="360" fill="url(#sea)"/>
      <!-- sun reflection on water -->
      <rect x="1070" y="540" width="100" height="300" fill="url(#reflect)" opacity="0.7">
        <animate attributeName="opacity" values="0.55;0.8;0.55" dur="5s" repeatCount="indefinite"/>
      </rect>
      <!-- shimmer lines -->
      <g stroke="#ffe6b0" stroke-width="2" opacity="0.45">
        <line x1="1040" y1="585" x2="1200" y2="585"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/></line>
        <line x1="1060" y1="620" x2="1180" y2="620"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="4.2s" repeatCount="indefinite"/></line>
        <line x1="1020" y1="660" x2="1220" y2="660"><animate attributeName="opacity" values="0.25;0.55;0.25" dur="3s" repeatCount="indefinite"/></line>
      </g>

      <!-- foreground seawall -->
      <rect x="0" y="812" width="1600" height="120" fill="#140d0a"/>
      <rect x="0" y="800" width="1600" height="18" fill="#21130c"/>
      <!-- classic car silhouette -->
      <g fill="#0d0805">
        <path d="M520 800 q12 -46 70 -50 l150 -6 q40 -30 96 -30 l150 0 q52 0 84 34 l86 6 q40 6 40 42 l0 4 -676 0 z"/>
        <circle cx="640" cy="802" r="30" fill="#0d0805"/>
        <circle cx="1000" cy="802" r="30" fill="#0d0805"/>
      </g>
      <!-- palm trees -->
      <g fill="#0d0805">
        <rect x="150" y="640" width="14" height="180"/>
        <path d="M157 642 q-70 -34 -120 -16 q60 -2 118 26 q-44 -56 -96 -64 q58 16 100 56 q-10 -64 22 -104 q4 56 -8 102 q44 -44 108 -50 q-58 24 -110 66 q70 -10 120 18 q-66 -6 -134 18z"/>
        <rect x="1452" y="600" width="16" height="220"/>
        <path d="M1460 602 q80 -40 138 -18 q-70 0 -134 30 q52 -64 112 -72 q-66 18 -114 64 q12 -72 -24 -118 q-6 64 8 116 q-50 -50 -122 -56 q66 26 124 74 q-80 -10 -136 22 q74 -8 148 18z"/>
      </g>
    </svg>
    <div class="hero-photo" style="--hero-img:url('/img/hero.jpg')"></div>
  </div>

  <div class="container hero-content">
    <div class="flag-bar">
      <span style="background:var(--teal)"></span>
      <span style="background:var(--cream)"></span>
      <span style="background:var(--rojo)"></span>
    </div>
    <h1><span data-i18n="hero.title1"></span> <span style="color:var(--gold);font-style:italic" data-i18n="hero.title2cine"></span></h1>
    <p class="lead" data-i18n="hero.lead"></p>
    <ul class="hero-points">
      <li><span class="tick">✦</span> <span data-i18n="hero.p1"></span></li>
      <li><span class="tick">✦</span> <span data-i18n="hero.p2"></span></li>
      <li><span class="tick">✦</span> <span data-i18n="hero.p3"></span></li>
    </ul>
    <div class="hero-cta">
      <a class="btn btn-primary" href="/send.html" data-i18n="cta.btn"></a>
      <a class="btn btn-ghost" href="#calc" data-i18n="calc.title"></a>
    </div>
  </div>

  <div class="scroll-cue"><div class="dot"></div><span data-i18n="hero.scroll"></span></div>
</section>

<!-- ======================= CALCULATOR ======================= -->
<section class="block" id="calc" style="padding-top:90px">
  <div class="container" style="max-width:560px">
    <div class="section-head reveal" style="margin-bottom:32px">
      <div class="eyebrow" data-i18n="calc.title"></div>
      <h2 data-i18n="methods.title"></h2>
    </div>
    <div class="calc reveal d1">
      <div class="field">
        <label data-i18n="calc.send"></label>
        <div class="amount-row"><input id="amount" type="number" inputmode="decimal" value="100" min="1" step="1"><span class="cur">USD</span></div>
      </div>
      <div class="field">
        <label data-i18n="calc.receiveVia"></label>
        <select id="method"></select>
      </div>
      <div class="breakdown" id="breakdown"></div>
      <div class="err hidden" id="calcErr"></div>
      <a class="btn btn-primary btn-block" id="calcGo" href="/send.html" data-i18n="common.continue"></a>
      <p class="muted center" style="font-size:.78rem;margin:.8rem 0 0" data-i18n="calc.indicative"></p>
    </div>
  </div>
</section>

<!-- ======================= METHODS ======================= -->
<section class="block" id="methods" style="padding-top:0">
  <div class="container">
    <div class="section-head reveal">
      <div class="eyebrow" data-i18n="methods.eyebrow"></div>
      <h2 data-i18n="methods.title"></h2>
      <p data-i18n="methods.sub"></p>
    </div>
    <div class="cards" id="methodCards"></div>
  </div>
</section>

<!-- ======================= STORY (text + image) ======================= -->
<section class="block" style="padding-top:0">
  <div class="container">
    <div class="story">
      <div class="reveal">
        <div class="eyebrow" data-i18n="trust.eyebrow"></div>
        <h2 data-i18n="story.title"></h2>
        <p data-i18n="story.body"></p>
        <div style="margin-top:22px"><a class="btn btn-ghost" href="/send.html" data-i18n="how.cta"></a></div>
      </div>
      <div class="media reveal d1" style="--story-img:url('/img/family.jpg')"></div>
    </div>
  </div>
</section>

<!-- ======================= HOW IT WORKS ======================= -->
<section class="block" id="how" style="padding-top:0">
  <div class="container">
    <div class="section-head reveal">
      <div class="eyebrow" data-i18n="how.eyebrow"></div>
      <h2 data-i18n="how.title"></h2>
    </div>
    <div class="steps">
      <div class="step reveal"><div class="num">1</div><h3 data-i18n="how.s1t"></h3><p data-i18n="how.s1p"></p></div>
      <div class="step reveal d1"><div class="num">2</div><h3 data-i18n="how.s2t"></h3><p data-i18n="how.s2p"></p></div>
      <div class="step reveal d2"><div class="num">3</div><h3 data-i18n="how.s3t"></h3><p data-i18n="how.s3p"></p></div>
      <div class="step reveal d3"><div class="num">4</div><h3 data-i18n="how.s4t"></h3><p data-i18n="how.s4p"></p></div>
    </div>
  </div>
</section>

<!-- ======================= TRUST BAND (image) ======================= -->
<section class="band">
  <div class="band-bg" style="--band-img:url('/img/malecon.jpg')" data-parallax="0.06"></div>
  <div class="container">
    <div class="section-head reveal">
      <div class="eyebrow" data-i18n="trust.eyebrow"></div>
      <h2 data-i18n="trust.title"></h2>
      <p data-i18n="trust.sub"></p>
    </div>
    <div class="stats" style="margin-bottom:48px">
      <div class="stat reveal"><div class="n"><span data-count="5">5</span></div><div class="l" data-i18n="stats.ways"></div></div>
      <div class="stat reveal d1"><div class="n" data-i18n="stats.minsValue"></div><div class="l" data-i18n="stats.mins"></div></div>
      <div class="stat reveal d2"><div class="n"><span data-count="16">16</span></div><div class="l" data-i18n="stats.provinces"></div></div>
      <div class="stat reveal d3"><div class="n">24/7</div><div class="l" data-i18n="stats.support"></div></div>
    </div>
    <div class="features">
      <div class="feature reveal"><div class="ico">🔒</div><h3 data-i18n="trust.f1t"></h3><p data-i18n="trust.f1p"></p></div>
      <div class="feature reveal d1"><div class="ico">🧾</div><h3 data-i18n="trust.f2t"></h3><p data-i18n="trust.f2p"></p></div>
      <div class="feature reveal d2"><div class="ico">🇨🇺</div><h3 data-i18n="trust.f3t"></h3><p data-i18n="trust.f3p"></p></div>
    </div>
  </div>
</section>

<!-- ======================= FEES ======================= -->
<section class="block" id="fees">
  <div class="container">
    <div class="section-head reveal">
      <div class="eyebrow" data-i18n="fees.eyebrow"></div>
      <h2 data-i18n="fees.title"></h2>
      <p data-i18n="fees.sub"></p>
    </div>
    <div class="card-box reveal d1" style="overflow-x:auto">
      <table class="tbl" id="feesTable">
        <thead><tr>
          <th data-i18n="fees.method"></th><th data-i18n="fees.receiveIn"></th>
          <th data-i18n="fees.rate"></th><th data-i18n="fees.fee"></th><th data-i18n="fees.deliveryCol"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</section>

<!-- ======================= FAQ ======================= -->
<section class="block" id="faq" style="padding-top:0">
  <div class="container" style="max-width:800px">
    <div class="section-head reveal"><div class="eyebrow" data-i18n="faq.eyebrow"></div><h2 data-i18n="faq.title"></h2></div>
    <div id="faqList"></div>
  </div>
</section>

<!-- ======================= CTA ======================= -->
<section class="block" style="padding-top:0">
  <div class="container">
    <div class="cta reveal" style="--cta-img:url('/img/cta.jpg')">
      <h2 data-i18n="cta.title"></h2>
      <p data-i18n="cta.sub"></p>
      <a class="btn btn-red" href="/send.html" data-i18n="cta.btn"></a>
    </div>
  </div>
</section>

<div id="footer"></div>

<script type="module">
import { api, METHOD_ICONS, money, t, renderHeader, renderFooter, applyI18n, initMotion } from '/js/app.js';
import { methodLabel, methodEta } from '/js/i18n.js';

let RATES = [];

async function boot() {
  await renderHeader();
  renderFooter();
  applyI18n();
  const { rates } = await api.get('/api/rates');
  RATES = rates;
  document.getElementById('method').innerHTML = rates.map(r => `<option value="${r.payout_method}"></option>`).join('');
  document.getElementById('amount').addEventListener('input', updateQuote);
  document.getElementById('method').addEventListener('change', updateQuote);
  document.addEventListener('langchange', renderDynamic);
  renderDynamic();
  updateQuote();
  initMotion();
}

function renderDynamic() {
  const sel = document.getElementById('method');
  [...sel.options].forEach(o => { o.textContent = methodLabel(o.value); });

  document.getElementById('methodCards').innerHTML = RATES.map((r, i) => `
    <div class="pcard reveal d${(i % 4)}">
      <div class="ico">${METHOD_ICONS[r.payout_method] || '💸'}</div>
      <h3>${methodLabel(r.payout_method)}</h3>
      <p>${t('methods.receiveIn')} <b style="color:var(--cream)">${r.payout_currency}</b>. ${t('methods.min')} $${r.min_send} · ${t('methods.max')} $${r.max_send}.</p>
      <div class="eta">⏱ ${methodEta(r.payout_method)}</div>
    </div>`).join('');

  document.querySelector('#feesTable tbody').innerHTML = RATES.map(r => `
    <tr>
      <td>${METHOD_ICONS[r.payout_method] || ''} ${methodLabel(r.payout_method)}</td>
      <td>${r.payout_currency}</td>
      <td>${r.rate} ${r.payout_currency}</td>
      <td>${feeText(r)}</td>
      <td>${methodEta(r.payout_method)}</td>
    </tr>`).join('');

  const faq = [['faq.q1','faq.a1'],['faq.q2','faq.a2'],['faq.q3','faq.a3'],['faq.q4','faq.a4'],['faq.q5','faq.a5']];
  document.getElementById('faqList').innerHTML = faq.map(([q,a]) => `
    <details class="card-box reveal" style="margin-bottom:14px">
      <summary>${t(q)}</summary>
      <p style="margin:.8rem 0 0">${t(a)}</p>
    </details>`).join('');

  updateQuote();
  initMotion();
}

function feeText(r) {
  if (!r.fee_pct && !r.fee_fixed) return t('fees.free');
  return `${r.fee_pct ? r.fee_pct + '%' : ''}${r.fee_pct && r.fee_fixed ? ' + ' : ''}${r.fee_fixed ? '$' + r.fee_fixed : ''}`;
}

let quoteTimer;
function updateQuote() { clearTimeout(quoteTimer); quoteTimer = setTimeout(doQuote, 220); }
async function doQuote() {
  const amount = document.getElementById('amount').value;
  const method = document.getElementById('method').value;
  const errEl = document.getElementById('calcErr');
  const bd = document.getElementById('breakdown');
  const go = document.getElementById('calcGo');
  if (!amount || Number(amount) <= 0) { bd.innerHTML = `<div class="row">${t('calc.enterAmount')}</div>`; return; }
  try {
    const q = await api.get(`/api/quote?amount=${encodeURIComponent(amount)}&payout_method=${method}`);
    bd.innerHTML = `
      <div class="row"><span>${t('calc.transferAmount')}</span><span>${money(q.send_amount)}</span></div>
      <div class="row"><span>${t('calc.fee')}</span><span>${money(q.fee)}</span></div>
      <div class="row total"><span>${t('calc.youPay')}</span><span>${money(q.total_charge)}</span></div>
      <div class="row get"><span>${t('calc.theyReceive')}</span><span>${money(q.payout_amount, q.payout_currency)}</span></div>
      <div class="row" style="margin-top:6px"><span>${t('calc.delivery')}</span><span>${methodEta(q.payout_method)}</span></div>`;
    if (q.errors && q.errors.length) { errEl.textContent = q.errors.join(' '); errEl.classList.remove('hidden'); go.classList.add('hidden'); }
    else { errEl.classList.add('hidden'); go.classList.remove('hidden'); go.href = `/send.html?amount=${q.send_amount}&method=${q.payout_method}`; }
  } catch (e) { bd.innerHTML = `<div class="row">${e.message}</div>`; }
}

boot();
</script>
</body>
</html>
